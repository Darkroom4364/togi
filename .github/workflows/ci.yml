name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  foxguard:
    name: Foxguard Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - name: Run Foxguard
        uses: 0sec-labs/foxguard/action@v0.8.1
        with:
          path: .
          severity: medium
          version: v0.8.1
          fail-on-findings: "false"
          upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  check:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Test
        run: cargo test --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Format
        run: cargo fmt -- --check

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Integration tests
        run: cargo test --locked -- --ignored

  dogfood:
    name: Dogfood (togi on togi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Build togi
        run: cargo build --locked --release
      - name: Run togi on last commit
        continue-on-error: true
        run: ./target/release/togi check --base HEAD~1 --test-cmd "cargo test --locked" --format terminal
