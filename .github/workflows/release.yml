name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  foxguard:
    name: Foxguard Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Run Foxguard
        uses: 0sec-labs/foxguard/action@v0.8.1
        with:
          path: .
          severity: medium
          version: v0.8.1
          fail-on-findings: "false"
          upload-sarif: "true"

  build:
    name: Build ${{ matrix.target }}
    needs: foxguard
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: togi-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: togi-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: togi-macos-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: togi-windows-x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz togi
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/togi.exe -DestinationPath ${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum ./*.tar.gz ./*.zip > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            *.tar.gz
            *.zip
            checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
            checksums.txt
          generate_release_notes: true
