[package]
name = "togi"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Fast, diff-targeted, multi-language mutation testing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Darkroom4364/togi"
readme = "README.md"
keywords = ["mutation-testing", "testing", "diff", "tree-sitter", "code-quality"]
categories = ["development-tools::testing", "command-line-utilities"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "macros"] }

# Parsing
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"

# Diff parsing
diffy = "0.4"

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Output
colored = "3"
serde_json = "1"

# Filesystem
tempfile = "3"
globset = "0.4"
ignore = "0.4"

# Byte counting
bytecount = "0.6"

# Shell parsing
shell-words = "1"

# Error handling
anyhow = "1"

# Signal handling
ctrlc = "3"

# Hashing
siphasher = "1"

# Platform
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
