name: 'togi - Mutation Testing'
description: 'Diff-targeted mutation testing for pull requests'
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  base:
    description: 'Base branch to diff against'
    required: false
    default: 'origin/main'
  timeout:
    description: 'Per-mutation timeout in seconds'
    required: false
    default: '30'
  test-cmd:
    description: 'Test command override'
    required: false
  format:
    description: 'Output format (terminal or json)'
    required: false
    default: 'terminal'
  version:
    description: 'togi version to use'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install togi
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(curl -fsSL https://api.github.com/repos/Darkroom4364/togi/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
        fi
        if [ -z "$VERSION" ]; then
          echo "Could not resolve latest Togi release version" >&2
          exit 1
        fi

        eval "$(bash "${{ github.action_path }}/.github/scripts/resolve-togi-asset.sh")"
        TEMP_ROOT="${RUNNER_TEMP:-.}"
        if command -v cygpath >/dev/null 2>&1; then
          TEMP_ROOT=$(cygpath -u "$TEMP_ROOT")
        fi
        mkdir -p "$TEMP_ROOT"

        TOGI_ARCHIVE_PATH="${TEMP_ROOT}/${TOGI_ARCHIVE}"
        curl -fL "https://github.com/Darkroom4364/togi/releases/download/${VERSION}/${TOGI_ARCHIVE}" -o "$TOGI_ARCHIVE_PATH"
        TOGI_ARCHIVE="$TOGI_ARCHIVE" TOGI_BINARY="$TOGI_BINARY" TOGI_ARCHIVE_PATH="$TOGI_ARCHIVE_PATH" bash "${{ github.action_path }}/.github/scripts/install-togi-archive.sh"

    - name: Run togi
      shell: bash
      env:
        TOGI_BASE: ${{ inputs.base }}
        TOGI_TIMEOUT: ${{ inputs.timeout }}
        TOGI_FORMAT: ${{ inputs.format }}
        TOGI_TEST_CMD: ${{ inputs.test-cmd }}
      run: |
        bash "${{ github.action_path }}/.github/scripts/run-togi.sh"
